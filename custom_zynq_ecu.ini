    aux_pump_prime_s    = scalar, U16, 476, "s",     0.1,  0.0, 0.5,   10.0,  1
    aux_fan1_on_clt     = scalar, U16, 478, "deg C", 0.1,  0.0, 70.0,  115.0, 1
    aux_fan1_off_clt    = scalar, U16, 480, "deg C", 0.1,  0.0, 65.0,  110.0, 1
    aux_fan2_on_clt     = scalar, U16, 482, "deg C", 0.1,  0.0, 75.0,  120.0, 1
    aux_fan2_off_clt    = scalar, U16, 484, "deg C", 0.1,  0.0, 70.0,  115.0, 1
    vanos_enable        = bits,   U08, 486, [0:0], "Desativado", "Habilitado (Single-VANOS)"
    ac_clutch_enable    = bits,   U08, 487, [0:0], "Desativado", "Habilitado (A/C + Fan1)"
    vanos_min_rpm       = scalar, U16, 488, "RPM",   1.0,  0.0, 1600,  2600,  0
    vanos_max_rpm       = scalar, U16, 490, "RPM",   1.0,  0.0, 3600,  5200,  0
    vanos_hyst_rpm      = scalar, U16, 492, "RPM",   1.0,  0.0, 150,   350,   0
    vanos_min_clt       = scalar, S16, 494, "deg C", 0.1,  0.0, 40.0,  90.0,  1
    vanos_min_oil_bar   = scalar, U16, 496, "bar",   0.1,  0.0, 1.8,   4.0,   1
    tach_out_enable     = bits,   U08, 498, [0:0], "Desativado", "Ativo (UNIV9 PWM)"
    dlog_rate_mode      = bits,   U08, 499, [0:1], "Desligado", "25 Hz", "50 Hz", "100 Hz (Padrao)"
    cam_phase_strict    = bits,   U08, 500, [0:0], "Sequencial Flexivel", "Estrito 720 (BMW M50)"
    dlog_auto_start     = bits,   U08, 501, [0:0], "Continuo (Chave Ligada)", "Auto ao Sincronizar Motor"

    ; --------------------------------------------------------------------------
    ; CURVAS 1D: DWELL POR TENSAO / RPM & DEAD-TIME DOS BICOS POR TENSAO
    ; --------------------------------------------------------------------------
    dwell_batt_v_axis   = array,  U16, 502, [6], "V",   0.1,  0.0, 6.0,   18.0,  1
    dwell_batt_ms       = array,  U16, 514, [6], "ms",  0.01, 0.0, 0.50,  4.00,  2
    dwell_rpm_axis      = array,  U16, 526, [6], "RPM", 1.0,  0.0, 500,   10000, 0
    dwell_rpm_mult      = array,  U16, 538, [6], "%",   0.1,  0.0, 50.0,  130.0, 1
    inj_dt_batt_v_axis  = array,  U16, 550, [6], "V",   0.1,  0.0, 6.0,   18.0,  1
    inj_dt_batt_ms      = array,  U16, 562, [6], "ms",  0.01, 0.0, 0.10,  4.00,  2

    ; --------------------------------------------------------------------------
    ; PAGINA 2: Tabelas 3D de Calibracao
    ; --------------------------------------------------------------------------
    page = 2
    ; Eixos da Tabela VE (RPM x MAP)
    rpm_bins_ve         = array,  U16,   0, [16], "RPM", 1.0, 0.0, 500, 10000, 0
    map_bins_ve         = array,  U16,  32, [16], "kPa", 0.1, 0.0,  20,   400, 1
    table_ve            = array,  U08,  64, [16x16], "%", 1.0, 0.0,  10,   255, 0

    ; Eixos da Tabela de Ponto de Ignicao MBT (RPM x MAP)
    rpm_bins_ign        = array,  U16, 320, [16], "RPM", 1.0, 0.0, 500, 10000, 0
    map_bins_ign        = array,  U16, 352, [16], "kPa", 0.1, 0.0,  20,   400, 1
    table_ign           = array,  S08, 384, [16x16], "deg", 0.5, 0.0, -10,  60, 1

    ; Eixos da Tabela de Demanda de Torque (RPM x TPS)
    rpm_bins_tq         = array,  U16, 640, [16], "RPM", 1.0, 0.0, 500, 10000, 0
    tps_bins_tq         = array,  U16, 672, [16], "%",   0.1, 0.0,   0,   100, 1
    table_torque_req    = array,  U16, 704, [16x16], "Nm", 0.1, 0.0,   0, 1000, 1

[OutputChannels]
    ochGetCommand       = "A"
    ochBlockSize        = 88

    seconds             = scalar, U16,  0, "s",      1.000, 0.0
    engine_rpm          = scalar, U16,  2, "RPM",    1.000, 0.0
    crank_angle_deg     = scalar, U16,  4, "deg",    1.000, 0.0
    map_kpa             = scalar, S16,  6, "kPa",    0.100, 0.0
    tps_percent         = scalar, S16,  8, "%",      0.100, 0.0
    clt_temp            = scalar, S16, 10, "deg C",  0.100, 0.0
    iat_temp            = scalar, S16, 12, "deg C",  0.100, 0.0
    batt_volts          = scalar, U16, 14, "V",      0.010, 0.0
    lambda_current      = scalar, U16, 16, "Lambda", 0.001, 0.0
    target_torque_nm    = scalar, S16, 18, "Nm",     0.100, 0.0
    actual_torque_nm    = scalar, S16, 20, "Nm",     0.100, 0.0
    ign_advance_deg     = scalar, S16, 22, "deg",    0.100, 0.0
    inj_pulse_ms        = scalar, U16, 24, "ms",     0.010, 0.0
    tooth_number        = scalar, U08, 26, "",       1.000, 0.0
    status_flags        = scalar, U08, 27, "",       1.000, 0.0
    oil_press_bar       = scalar, U16, 28, "bar",    0.010, 0.0
    fuel_diff_bar       = scalar, S16, 30, "bar",    0.010, 0.0
    oil_temp            = scalar, S16, 32, "deg C",  0.100, 0.0
    active_faults       = scalar, U16, 34, "",       1.000, 0.0
    prot_level          = scalar, U08, 36, "",       1.000, 0.0
    reserved_prot       = scalar, U08, 37, "",       1.000, 0.0
    rev_limit_eff       = scalar, U16, 38, "RPM",    1.000, 0.0
    lambda_target_out   = scalar, U16, 40, "Lambda", 0.001, 0.0

    ; Telemetria EGT dos 6 Cilindros (FuelTech CAN)
    egt_cyl1            = scalar, S16, 42, "deg C",  1.000, 0.0
    egt_cyl2            = scalar, S16, 44, "deg C",  1.000, 0.0
    egt_cyl3            = scalar, S16, 46, "deg C",  1.000, 0.0
    egt_cyl4            = scalar, S16, 48, "deg C",  1.000, 0.0
    egt_cyl5            = scalar, S16, 50, "deg C",  1.000, 0.0
    egt_cyl6            = scalar, S16, 52, "deg C",  1.000, 0.0

    ; Trims Individuais de Injecao por Cilindro (Soma Zero)
    egt_trim1           = scalar, S16, 54, "%",      0.100, 0.0
    egt_trim2           = scalar, S16, 56, "%",      0.100, 0.0
    egt_trim3           = scalar, S16, 58, "%",      0.100, 0.0
    egt_trim4           = scalar, S16, 60, "%",      0.100, 0.0
    egt_trim5           = scalar, S16, 62, "%",      0.100, 0.0
    egt_trim6           = scalar, S16, 64, "%",      0.100, 0.0

    ; Telemetria do Boost Controller & Subsistema de Ar de Bordo
    wg_dome_press       = scalar, U16, 66, "kPa",    0.100, 0.0
    wg_dome_target      = scalar, U16, 68, "kPa",    0.100, 0.0
    boost_pwm_inc       = scalar, U16, 70, "%",      0.100, 0.0
    boost_pwm_dec       = scalar, U16, 72, "%",      0.100, 0.0
    coolant_press       = scalar, U16, 74, "bar",    0.010, 0.0
    air_tank_press      = scalar, U16, 76, "bar",    0.010, 0.0
    wg_bottom_press     = scalar, U16, 78, "kPa",    0.100, 0.0
    boost_bottom_inc    = scalar, U16, 80, "%",      0.100, 0.0
    boost_bottom_dec    = scalar, U16, 82, "%",      0.100, 0.0
    boost_4port_pwm     = scalar, U16, 84, "%",      0.100, 0.0
    compressor_status   = scalar, U08, 86, "",       1.000, 0.0
    reserved_comp       = scalar, U08, 87, "",       1.000, 0.0

    engine_synced       = { (status_flags & 0x01) != 0 }
    stroke_720          = { (status_flags & 0x02) != 0 }
    ecu_disable_active  = { (status_flags & 0x04) != 0 }
    limp_mode_active    = { prot_level >= 2 }
    check_engine_light  = { prot_level >= 1 }
    fault_oil_press     = { (active_faults & 0x0001) != 0 }
    fault_fuel_press    = { (active_faults & 0x0002) != 0 }
    fault_injector      = { (active_faults & 0x0018) != 0 }
    fault_clt           = { (active_faults & 0x0020) != 0 }
    fault_oil_temp      = { (active_faults & 0x0040) != 0 }
    fault_iat           = { (active_faults & 0x0080) != 0 }
    fault_lean_boost    = { (active_faults & 0x0100) != 0 }
    fault_overboost     = { (active_faults & 0x0200) != 0 }
    fault_coolant_press = { (active_faults & 0x4000) != 0 }
    compressor_running  = { (compressor_status & 0x01) != 0 }
    compressor_fault    = { (compressor_status & 0x02) != 0 }
    vanos_active        = { (compressor_status & 0x04) != 0 }
    ac_clutch_active    = { (compressor_status & 0x08) != 0 }
    launch_active       = { (compressor_status & 0x10) != 0 }
    cam_phase_fault     = { (compressor_status & 0x20) != 0 }
    cal_durable_gen     = { reserved_comp }
    cal_page0_dirty     = { (reserved_prot & 0x01) != 0 }
    cal_page1_dirty     = { (reserved_prot & 0x02) != 0 }
    cal_burn_ok         = { (reserved_prot & 0x04) != 0 }
    cal_burn_refused    = { (reserved_prot & 0x08) != 0 }
    cal_burn_error      = { (reserved_prot & 0x10) != 0 }

    ; Calculo Acustico em Tempo Real do Knock (Equacao de Ressonancia de Draper)
    ; f_fundamental = 1800.0 / (pi * bore_mm) = 572.958 / bore_mm
    knock_calc_freq     = { knock_bore_mm > 0 ? (1800.0 / (3.1415926535 * knock_bore_mm)) : 6.58 }
    knock_harm2_freq    = { 2.0 * knock_calc_freq }

[GaugeConfigurations]
