    fuelDiffGauge       = fuel_diff_bar,   "Pressao Diferencial Comb",  "bar",    0,    6, 2.2, 2.7,  3.5,  4.0, 2, 2
    oilTempGauge        = oil_temp,        "Temperatura do Oleo (EOT)", "°C",    20,  160,  60,  70,  125,  135, 1, 1
    limpRevGauge        = rev_limit_eff,   "Corte de Seguranca Limp",   "RPM",    0, 9000, 2000,2500, 7000, 7500, 0, 0
    targetLambdaGauge   = lambda_target_out,"Lambda Alvo Otimizado",     "Lambda",0.65,1.30,0.75,0.80,1.05, 1.15, 3, 3
    domePressGauge      = wg_dome_press,   "Pressao Cupula Wastegate",  "kPa",    0,  400,    0,   0,  250,  320, 1, 1
    coolantPressGauge   = coolant_press,   "Pressao Arrefecimento",     "bar",    0,    5,  0.8, 1.0,  1.8,  2.2, 2, 2
    boostIncGauge       = boost_pwm_inc,   "PWM Increase (CO2)",        "%",      0,  100,    0,   0,   80,  100, 1, 1
    boostDecGauge       = boost_pwm_dec,   "PWM Decrease (Alivio)",     "%",      0,  100,    0,   0,   80,  100, 1, 1
    airTankPressGauge   = air_tank_press,  "Pressao Reservatorio Ar",   "bar",    0,   12,  5.0, 6.0,  9.0, 10.5, 2, 2
    wgBottomPressGauge  = wg_bottom_press, "Pressao Cupula Inferior WG","kPa",    0,  400,    0,   0,  250,  320, 1, 1
    boost4PortGauge     = boost_4port_pwm, "PWM Solenoide MAC 4 Vias",  "%",      0,  100,    0,   0,   85,  100, 1, 1

