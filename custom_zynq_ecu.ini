; ==============================================================================
; ARQUIVO DE DEFINICAO TUNERSTUDIO (custom_zynq_ecu.ini)
; ECU Automotiva Hibrida Zynq-7010 (EBAZ4205) + ESP32
; Suporta Modelo Baseado em Torque, Injecao/Ignicao 3D e Telemetria em Tempo Real
; ==============================================================================

[MegaTune]
    MTversion      = 2.25
    signature      = "speeduino 202611"
    queryCommand   = "Q"
    versionInfo    = "S"

[SettingContextHelp]

[Constants]
    endianness          = big
    nPages              = 2
    pageSize            = 1024, 2048
    pageIdentifier      = "\x00\x00", "\x00\x01"
    pageReadCommand     = "r%2i%2o%2c", "r%2i%2o%2c"
    pageChunkWrite      = "w%2i%2o%2c%v", "w%2i%2o%2c%v"
    burnCommand         = "b%2i", "b%2i"
    blockingFactor      = 256
    interWriteDelay     = 10
    pageActivationDelay = 10
    writeBlocks         = on

    ; --------------------------------------------------------------------------
    ; PAGINA 1: Configuracoes Gerais do Motor e Parametros de Controle
    ; --------------------------------------------------------------------------
    page = 1
    engine_cylinders    = bits,   U08,   0, [0:2], "4 Cilindros", "6 Cilindros (M50)", "8 Cilindros", "3 Cilindros", "5 Cilindros", "INVALID", "INVALID", "INVALID"
    engine_displacement = scalar, U16,   2, "cc",    1.0,  0.0, 500,  8000, 0
    rev_limiter_hard    = scalar, U16,   4, "RPM",   1.0,  0.0, 1000, 12000, 0
    rev_limiter_soft    = scalar, U16,   6, "RPM",   1.0,  0.0, 1000, 12000, 0
    injector_flow       = scalar, U16,   8, "cc/min",1.0,  0.0, 100,  2000, 0
    max_boost_target    = scalar, U16,  10, "kPa",   0.1,  0.0, 100,   500, 1
    max_torque_limit    = scalar, U16,  12, "Nm",    0.1,  0.0, 50,   1500, 1

    ; Parametros da Marcha Lenta Dual-Path
    idle_target_cold    = scalar, U16,  14, "RPM",   1.0,  0.0, 600,  2500, 0
    idle_target_hot     = scalar, U16,  16, "RPM",   1.0,  0.0, 500,  1800, 0
    idle_base_spark     = scalar, S16,  18, "deg",   0.1,  0.0, 0,    35.0, 1
    idle_ac_air_bump    = scalar, U16,  20, "%",     0.1,  0.0, 0,    30.0, 1

    ; Parametros da Injecao Rapida Tau-Beta (Wall-Wetting)
    transient_beta      = scalar, U16,  22, "%",     0.1,  0.0, 5.0,  80.0, 1
    transient_tau_ms    = scalar, U16,  24, "ms",    1.0,  0.0, 20,   800,  0

    ; Parametros da Malha Fechada Preditiva (Smith Predictor)
    exhaust_volume_dl   = scalar, U16,  26, "L",     0.1,  0.0, 0.5,  6.0,  1
    lambda_cl_min_trim  = scalar, S16,  28, "%",     0.1,  0.0, -35.0, 0.0, 1
    lambda_cl_max_trim  = scalar, U16,  30, "%",     0.1,  0.0, 0.0,  40.0, 1

    ; Rotational Idle (Brap Brap de Rotativo / Ghost Cam)
    rot_idle_mode       = bits,   U08,  32, [0:1], "Desativado", "Sempre Ativo na Lenta", "Botao Fisico no Painel", "Virtual ESP32 / App"
    rot_idle_style      = bits,   U08,  33, [0:1], "Suave (Comando 288)", "Medio (Comando 305)", "Agressivo (Brap Brap Rotativo)", "INVALID"
    rot_idle_min_clt    = scalar, U16,  34, "deg C", 0.1,  0.0, 40.0, 100.0, 1
    rot_idle_spark      = scalar, S16,  36, "deg",   0.1,  0.0, -15.0, 15.0, 1
    rot_idle_extra_air  = scalar, U16,  38, "%",     0.1,  0.0, 0.0,  50.0,  1

    ; Controle de Detonacao Adaptativo (Knock 87mm)
    knock_freq_khz      = scalar, U16,  40, "kHz",   0.01, 0.0, 4.0,  15.0, 2
    knock_thresh_mult   = scalar, U16,  42, "x",     0.01, 0.0, 1.10, 3.50, 2
    knock_retard_step   = scalar, S16,  44, "deg",   0.1,  0.0, -10.0, 0.0, 1
    knock_max_retard    = scalar, S16,  46, "deg",   0.1,  0.0, -15.0, 0.0, 1

    ; Parametros Flex Fuel & Boost Dinamico
    flex_gas_boost      = scalar, U16,  48, "kPa",   0.1,  0.0, 100.0, 300.0, 1
    flex_e100_boost     = scalar, U16,  50, "kPa",   0.1,  0.0, 100.0, 400.0, 1
    flex_max_spark      = scalar, U16,  52, "deg",   0.1,  0.0, 0.0,   15.0,  1

    ; Sensor Barometrico Dedicado (Altitude)
    baro_max_pr         = scalar, U16,  54, "PR",    0.01, 0.0, 1.50,  3.50,  2

    ; Parametros de Protecao Ativa de Motor e Limp Modes
    prot_oil_idle_min   = scalar, U16,  56, "bar",   0.1,  0.0, 0.5,   3.0, 1
    prot_oil_high_min   = scalar, U16,  58, "bar",   0.1,  0.0, 2.0,   6.0, 1
    prot_oil_crit_shut  = scalar, U16,  60, "bar",   0.1,  0.0, 0.2,   2.0, 1
    prot_fuel_diff_min  = scalar, U16,  62, "bar",   0.1,  0.0, 1.5,   4.0, 1
    prot_clt_warn       = scalar, U16,  64, "deg C", 0.1,  0.0, 80.0, 120.0, 1
    prot_clt_limp       = scalar, U16,  66, "deg C", 0.1,  0.0, 95.0, 130.0, 1
    prot_oil_temp_limp  = scalar, U16,  68, "deg C", 0.1,  0.0, 100.0, 150.0, 1
    prot_iat_limp       = scalar, U16,  70, "deg C", 0.1,  0.0, 50.0, 100.0, 1
    prot_lean_max_lam   = scalar, U16,  72, "Lambda", 0.001, 0.0, 0.75, 1.10, 3
    prot_overboost_kpa  = scalar, U16,  74, "kPa",   0.1,  0.0, 10.0, 100.0, 1
    prot_rev_limp_soft  = scalar, U16,  76, "RPM",   1.0,  0.0, 2000, 6000, 0
    prot_rev_limp_hard  = scalar, U16,  78, "RPM",   1.0,  0.0, 1500, 4500, 0

    ; Otimizador Preditivo Termodinamico de Lambda Alvo
    lambda_target_mode  = bits,   U08,  80, [0:1], "Manual (Tabela Fixa TunerStudio)", "Auto Preditivo Termodinamico", "Hibrido Inteligente (Tabela + Compensacoes)", "INVALID"
    lambda_gas_boost    = scalar, U16,  82, "Lambda", 0.001, 0.0, 0.70, 1.00, 3
    lambda_e100_boost   = scalar, U16,  84, "Lambda", 0.001, 0.0, 0.70, 1.00, 3
    lambda_gas_cruise   = scalar, U16,  86, "Lambda", 0.001, 0.0, 0.90, 1.15, 3
    lambda_e100_cruise  = scalar, U16,  88, "Lambda", 0.001, 0.0, 0.90, 1.15, 3

    ; Modo Pista / Track Mode & Partida Rapida Start-Stop
    track_mode_en       = bits,   U08,  90, [0:0], "Modo Rua (Seguranca Estrita)", "Modo Pista / Track Mode (Margens Ampliadas)"
    crank_prime_ms      = scalar, U16,  92, "ms",    0.1,  0.0, 0.0,  30.0, 1
    crank_spark_deg     = scalar, S16,  94, "deg",   0.1,  0.0, 0.0,  20.0, 1
    crank_ase_pct       = scalar, U16,  96, "%",     0.1,  0.0, 0.0, 100.0, 1

    ; Balanco Termico de EGT por Cilindro (FuelTech CAN - 2x EGT-4)
    egt_balance_en      = bits,   U08,  98, [0:0], "Desativado", "Ativo (Soma Zero Automatica)"
    egt_max_trim_pct    = scalar, U16, 100, "%",     0.1,  0.0, 1.0,  20.0, 1
    egt_crit_temp       = scalar, U16, 102, "deg C", 1.0,  0.0, 700.0, 1100.0, 0
    egt_min_load_kpa    = scalar, U16, 104, "kPa",   0.1,  0.0, 20.0, 200.0, 1

    ; --------------------------------------------------------------------------
    ; GERENCIADOR UNIVERSAL DE SAIDAS (OUTPUT PORTS 1 A 17)
    ; --------------------------------------------------------------------------
