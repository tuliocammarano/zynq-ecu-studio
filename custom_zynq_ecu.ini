    targetTorqueGauge   = target_torque_nm,"Torque Solicitado",         "Nm",     0, 1000,   0,   0,  700,  850, 1, 1
    actualTorqueGauge   = actual_torque_nm,"Torque Estimado",           "Nm",     0, 1000,   0,   0,  700,  850, 1, 1
    cltGauge            = clt_temp,        "Temperatura da Agua (CLT)", "°C",   -20,  130,  50,  70,  100,  110, 1, 1
    iatGauge            = iat_temp,        "Temperatura do Ar (IAT)",   "°C",   -20,  100,  10,  20,   55,   70, 1, 1
